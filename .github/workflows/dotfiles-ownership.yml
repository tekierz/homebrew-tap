name: Dotfiles ownership regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ownership:
    name: Preserve unrelated legacy executables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ruby ruby-minitest

      - name: Check Ruby syntax
        run: |
          ruby -c Formula/dotfiles.rb
          ruby -c test/dotfiles_ownership_test.rb

      - name: Verify ownership preservation without installing packages
        run: ruby test/dotfiles_ownership_test.rb

      - name: Check patch whitespace
        run: git show --format= --check HEAD

  macos-acceptance:
    name: Real Homebrew install and uninstall ownership
    needs: ownership
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify script syntax
        run: bash -n test/dotfiles_homebrew_acceptance.sh

      - name: Exercise disposable Homebrew prefix
        shell: bash
        run: |
          set -euo pipefail
          bash test/dotfiles_homebrew_acceptance.sh 2>&1 | tee "$RUNNER_TEMP/dotfiles-homebrew-acceptance.log"
          grep -F 'DOTFILES_HOMEBREW_ACCEPTANCE_PASSED cases=3' "$RUNNER_TEMP/dotfiles-homebrew-acceptance.log"
